# Builds the Orin Router Docker image on GitHub's runners (16 GB RAM — Render's
# 8 GB build container OOMs on this monorepo) and publishes it to GHCR so
# Render/HF can deploy a prebuilt image instead of building.
name: Build Orin Router image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/**"
  workflow_dispatch:
  # Never run two heavy builds at once — a new push supersedes the running one.
concurrency:
  group: orin-router-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/januth1234/orin-router:latest
            ghcr.io/januth1234/orin-router:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
